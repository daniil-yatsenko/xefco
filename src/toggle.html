<label class="plasma-toggle">
    <input type="checkbox" class="plasma-toggle__input" />
    <span class="plasma-toggle__track">
        <span class="plasma-toggle__orb">
            <span class="plasma-toggle__halo"></span>
            <span class="plasma-toggle__core"></span>
            <span
                class="plasma-toggle__swirl plasma-toggle__swirl--grey-1"
            ></span>
            <span
                class="plasma-toggle__swirl plasma-toggle__swirl--grey-2"
            ></span>
            <span
                class="plasma-toggle__swirl plasma-toggle__swirl--purple-1"
            ></span>
            <span
                class="plasma-toggle__swirl plasma-toggle__swirl--purple-2"
            ></span>
            <span
                class="plasma-toggle__swirl plasma-toggle__swirl--purple-3"
            ></span>
        </span>
    </span>
    <!-- <span class="plasma-toggle__label">label text</span> -->
</label>

<style>
    .plasma-toggle {
        --pt-track-w: 3em;
        --pt-track-h: 1.55em;
        --pt-orb-size: 1.85em;
        --pt-duration: 0.3s;
        --pt-easing: cubic-bezier(0.7, 0, 0.3, 1);

        font-size: 3rem; /* change this to resize */
        display: inline-flex;
        align-items: center;
        gap: 0.6em;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    /* Visually hide the checkbox but keep it accessible */
    .plasma-toggle__input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .plasma-toggle__track {
        position: relative;
        width: var(--pt-track-w);
        height: var(--pt-track-h);
        border-radius: calc(var(--pt-track-h) / 2);
        background: radial-gradient(
            ellipse at center,
            #221e30 0%,
            #0d0a18 100%
        );
        box-shadow:
            inset 0 0.07em 0.3em rgba(0, 0, 0, 0.8),
            inset 0 -0.04em 0.08em rgba(255, 255, 255, 0.04),
            0 0.15em 0.7em rgba(0, 0, 0, 0.25);
        overflow: hidden;
        flex-shrink: 0;
        transition: box-shadow 0.2s ease;
    }

    /* Focus ring — keyboard navigation */
    .plasma-toggle__input:focus-visible ~ .plasma-toggle__track {
        box-shadow:
            inset 0 0.07em 0.3em rgba(0, 0, 0, 0.8),
            inset 0 -0.04em 0.08em rgba(255, 255, 255, 0.04),
            0 0 0 3px #a78bfa,
            0 0.15em 0.7em rgba(0, 0, 0, 0.25);
    }

    .plasma-toggle__orb {
        position: absolute;
        top: 50%;
        left: calc(var(--pt-orb-size) / 2 + 0.05em);
        transform: translate(-50%, -50%);
        width: var(--pt-orb-size);
        height: var(--pt-orb-size);
        border-radius: 50%;
        transition: left var(--pt-duration) var(--pt-easing);
        pointer-events: none;
    }

    .plasma-toggle__input:checked ~ .plasma-toggle__track .plasma-toggle__orb {
        left: calc(var(--pt-track-w) - var(--pt-orb-size) / 2 - 0.05em);
    }

    /* Soft halo — no hard edges */
    .plasma-toggle__halo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
            circle at 50% 50%,
            rgba(190, 190, 190, 0.95) 5%,
            rgba(100, 100, 115, 0.45) 35%,
            rgba(70, 70, 90, 0.18) 50%,
            rgba(40, 40, 60, 0.08) 60%,
            transparent 75%
        );
        filter: blur(0.08em);
    }

    .plasma-toggle__halo::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
            circle at 50% 50%,
            rgba(220, 190, 255, 0.85) 0%,
            rgba(180, 140, 255, 0.6) 15%,
            rgba(130, 90, 220, 0.35) 30%,
            rgba(80, 50, 170, 0.15) 45%,
            transparent 65%
        );
        opacity: 0;
        transition: opacity var(--pt-duration) ease;
    }

    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__halo::after {
        opacity: 1;
    }

    /* Inner bright core */
    .plasma-toggle__core {
        position: absolute;
        inset: 25%;
        border-radius: 50%;
        background: radial-gradient(
            circle at 45% 45%,
            rgba(200, 200, 210, 0.9) 0%,
            rgba(150, 150, 165, 0.6) 30%,
            rgba(100, 100, 120, 0.3) 55%,
            transparent 80%
        );
        filter: blur(0.05em);
    }

    .plasma-toggle__core::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
            circle at 45% 45%,
            rgba(245, 230, 255, 0.95) 0%,
            rgba(210, 180, 255, 0.75) 30%,
            rgba(160, 120, 240, 0.4) 55%,
            transparent 80%
        );
        opacity: 0;
        transition: opacity var(--pt-duration) ease;
    }

    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__core::after {
        opacity: 1;
    }

    /* Swirling plasma layers */
    .plasma-toggle__swirl {
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        mix-blend-mode: screen;
        filter: blur(0.1em);
        transition: opacity var(--pt-duration) ease;
        -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
        mask-image: radial-gradient(circle, black 20%, transparent 70%);
    }

    /* Grey swirls (off) */
    .plasma-toggle__swirl--grey-1 {
        background:
            radial-gradient(
                circle at 30% 40%,
                rgba(180, 180, 190, 0.45) 0%,
                transparent 30%
            ),
            radial-gradient(
                circle at 70% 60%,
                rgba(160, 160, 170, 0.4) 0%,
                transparent 28%
            ),
            radial-gradient(
                circle at 50% 30%,
                rgba(140, 140, 150, 0.35) 0%,
                transparent 35%
            );
        animation: pt-swirl-a 8s linear infinite;
    }

    .plasma-toggle__swirl--grey-2 {
        background:
            radial-gradient(
                circle at 60% 50%,
                rgba(200, 200, 210, 0.5) 0%,
                transparent 25%
            ),
            radial-gradient(
                circle at 30% 70%,
                rgba(150, 150, 160, 0.45) 0%,
                transparent 30%
            );
        animation: pt-swirl-b 11s linear infinite reverse;
    }

    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__swirl--grey-1,
    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__swirl--grey-2 {
        opacity: 0;
    }

    /* Purple swirls (on) */
    .plasma-toggle__swirl--purple-1 {
        background:
            radial-gradient(
                circle at 30% 40%,
                rgba(180, 140, 255, 0.5) 0%,
                transparent 30%
            ),
            radial-gradient(
                circle at 70% 60%,
                rgba(200, 160, 255, 0.45) 0%,
                transparent 28%
            ),
            radial-gradient(
                circle at 50% 30%,
                rgba(150, 100, 220, 0.4) 0%,
                transparent 35%
            );
        animation: pt-swirl-a 8s linear infinite;
        opacity: 0;
    }

    .plasma-toggle__swirl--purple-2 {
        background:
            radial-gradient(
                circle at 60% 50%,
                rgba(220, 180, 255, 0.55) 0%,
                transparent 25%
            ),
            radial-gradient(
                circle at 30% 70%,
                rgba(160, 120, 230, 0.5) 0%,
                transparent 30%
            ),
            radial-gradient(
                circle at 80% 30%,
                rgba(180, 140, 240, 0.45) 0%,
                transparent 28%
            );
        animation: pt-swirl-b 11s linear infinite reverse;
        opacity: 0;
    }

    .plasma-toggle__swirl--purple-3 {
        background:
            radial-gradient(
                circle at 45% 55%,
                rgba(240, 220, 255, 0.5) 0%,
                transparent 22%
            ),
            radial-gradient(
                circle at 65% 35%,
                rgba(200, 170, 250, 0.45) 0%,
                transparent 25%
            );
        animation: pt-swirl-c 6s ease-in-out infinite;
        opacity: 0;
    }

    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__swirl--purple-1,
    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__swirl--purple-2,
    .plasma-toggle__input:checked
        ~ .plasma-toggle__track
        .plasma-toggle__swirl--purple-3 {
        opacity: 1;
    }

    /* Noise overlays */
    .plasma-toggle__noise {
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(
            circle,
            black 0%,
            black 30%,
            transparent 70%
        );
        mask-image: radial-gradient(
            circle,
            black 0%,
            black 30%,
            transparent 70%
        );
    }

    .plasma-toggle__noise--fine {
        mix-blend-mode: overlay;
        opacity: 0.75;
    }

    .plasma-toggle__noise--speckle {
        mix-blend-mode: screen;
        opacity: 0.35;
        inset: 15%;
        -webkit-mask-image: radial-gradient(
            circle,
            black 0%,
            black 25%,
            transparent 65%
        );
        mask-image: radial-gradient(
            circle,
            black 0%,
            black 25%,
            transparent 65%
        );
    }

    /* Label text */
    .plasma-toggle__label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.55em;
        color: #333;
        line-height: 1.2;
    }

    /* Disabled state */
    .plasma-toggle__input:disabled ~ .plasma-toggle__track {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .plasma-toggle:has(.plasma-toggle__input:disabled) {
        cursor: not-allowed;
    }

    /* Animations */
    @keyframes pt-swirl-a {
        0% {
            transform: rotate(0deg) scale(1) translate(0, 0);
        }
        25% {
            transform: rotate(90deg) scale(1.1) translate(3%, -2%);
        }
        50% {
            transform: rotate(180deg) scale(0.95) translate(-2%, 3%);
        }
        75% {
            transform: rotate(270deg) scale(1.05) translate(2%, 2%);
        }
        100% {
            transform: rotate(360deg) scale(1) translate(0, 0);
        }
    }

    @keyframes pt-swirl-b {
        0% {
            transform: rotate(0deg) scale(1.05) translate(0, 0);
        }
        33% {
            transform: rotate(120deg) scale(0.95) translate(-3%, 1%);
        }
        66% {
            transform: rotate(240deg) scale(1.08) translate(2%, -2%);
        }
        100% {
            transform: rotate(360deg) scale(1.05) translate(0, 0);
        }
    }

    @keyframes pt-swirl-c {
        0%,
        100% {
            transform: scale(1) translate(0, 0);
        }
        50% {
            transform: scale(1.15) translate(1%, -1%);
        }
    }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
        .plasma-toggle__swirl,
        .plasma-toggle__orb,
        .plasma-toggle__halo,
        .plasma-toggle__core {
            animation: none !important;
            transition-duration: 0.01ms !important;
        }
        .plasma-toggle__noise svg feTurbulence animate {
            display: none;
        }
    }
</style>
